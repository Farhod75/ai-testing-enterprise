[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testing-enterprise"
version = "0.1.0"
description = "Enterprise AI Testing Suite — 5 phases with Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "vcrpy>=6.0",
    "playwright>=1.44",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests — no API calls",
    "component: Component tests — mocked API",
    "integration: Real API calls — requires ANTHROPIC_API_KEY",
    "system: Full system/eval tests",
    "e2e: End-to-end with Playwright",
]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50