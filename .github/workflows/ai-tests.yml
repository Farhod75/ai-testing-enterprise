# .github/workflows/ai-tests.yml
#
# CI/CD Pipeline — runs all 5 test phases on every commit
#
# Phases run in order:
#   1. Unit tests        (fast, free — always run)
#   2. Component tests   (fast, free — always run)
#   3. Integration tests (real API — runs on main branch)
#   4. System tests      (real API — runs on main branch)
#   5. E2E tests         (real API + browser — runs on main branch)
#
# Setup: Add ANTHROPIC_API_KEY to GitHub repo secrets
# Settings → Secrets → Actions → New repository secret

name: AI Testing Enterprise — All 5 Phases

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────
  # Phase 1 + 2: Fast tests (no API key needed)
  # Runs on EVERY push and PR
  # ─────────────────────────────────────────
  unit-and-component:
    name: "Phase 1+2 — Unit & Component Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Phase 1 — Unit Tests
        run: pytest tests/unit/ -v --tb=short

      - name: Phase 2 — Component Tests
        run: pytest tests/component/ -v --tb=short

      - name: Coverage Report
        run: pytest tests/unit/ tests/component/ --cov=src --cov-report=term-missing

  # ─────────────────────────────────────────
  # Phase 3: Integration tests (real API)
  # Runs only on main branch (costs money)
  # ─────────────────────────────────────────
  integration:
    name: "Phase 3 — Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-and-component
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Phase 3 — Integration Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-20250514
        run: pytest tests/integration/ -v -s --tb=short

  # ─────────────────────────────────────────
  # Phase 4: System tests (eval suite)
  # Runs only on main branch
  # ─────────────────────────────────────────
  system:
    name: "Phase 4 — System & Eval Tests"
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Phase 4 — System Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-20250514
        run: pytest tests/system/ -v -s --tb=short

  # ─────────────────────────────────────────
  # Phase 5: E2E tests (browser + app)
  # Runs only on main branch
  # ─────────────────────────────────────────
  e2e:
    name: "Phase 5 — E2E Tests"
    runs-on: ubuntu-latest
    needs: system
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]" fastapi uvicorn httpx

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Start web app in background
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uvicorn src.app:app --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health || exit 1

      - name: Phase 5 — E2E Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_BASE_URL: http://localhost:8000
        run: pytest tests/e2e/ -v -s --tb=short